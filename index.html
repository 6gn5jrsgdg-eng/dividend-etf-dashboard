async function fetchWithRetry(url, retries = 2, delayMs = 800, timeoutMs = 8000) {
  let lastErr;
  for (let i = 0; i <= retries; i++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort('timeout'), timeoutMs);
    try {
      const resp = await fetch(url, { mode: 'cors', cache: 'no-store', signal: controller.signal });
      clearTimeout(timer);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return await resp.json();
    } catch (err) {
      clearTimeout(timer);
      lastErr = err;
      if (i < retries) await new Promise(r => setTimeout(r, delayMs * (i + 1)));
    }
  }
  throw lastErr;
}

// 获取实时行情

  return data.data.diff;
}

// 获取K线数据（单只ETF）- 使用腾讯API，浏览器CORS友好
async function fetchKline(code, market, count) {
  const tcode = (market === '0' ? 'sz' : 'sh') + code;
  const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${tcode},day,,,${count},qfq`;
  try {
    const data = await fetchWithRetry(url, 1, 600, 10000);
    if (!data || !data.data || !data.data[tcode]) return [];
    const arr = data.data[tcode].qfqday || data.data[tcode].day;
    if (!arr || arr.length === 0) return [];
    return arr.map(item => ({
      date: item[0].replace(/-/g, ''),
      open: parseFloat(item[1]),
      close: parseFloat(item[2]),
      high: parseFloat(item[3]),
      low: parseFloat(item[4]),
      volume: parseFloat(item[5]),
      amount: 0
    }));
  } catch (e) {
    console.warn(`K线获取失败 ${code}:`, e.message);
    return [];
  }
}

    }
  }
  return results;
}

// 计算历史高低点
function calcHighLow(klines) {
  if (!klines || klines.length === 0) return null;
  const now = new Date();
  const oneMonthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  const sixMonthsAgo = new Date(now.getTime() - 182 * 24 * 60 * 60 * 1000);
  const oneYearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);

  const periods = {
    m1: { high: -Infinity, low: Infinity },
    m6: { high: -Infinity, low: Infinity },
    y1: { high: -Infinity, low: Infinity }
  };

  for (const k of klines) {
    const ds = k.date.length === 8 ? k.date.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3') : k.date;
    const d = new Date(ds);
    if (d >= oneMonthAgo) {
      if (k.high > periods.m1.high) periods.m1.high = k.high;
      if (k.low < periods.m1.low) periods.m1.low = k.low;
    }
    if (d >= sixMonthsAgo) {
      if (k.high > periods.m6.high) periods.m6.high = k.high;
      if (k.low < periods.m6.low) periods.m6.low = k.low;
    }
    if (d >= oneYearAgo) {
      if (k.high > periods.y1.high) periods.y1.high = k.high;
      if (k.low < periods.y1.low) periods.y1.low = k.low;
    }
  }
  return periods;
}

// 计算移动平均线及偏离度
function calcMA(klines, price) {
  if (!klines || klines.length === 0) return { ma120: null, ma250: null, dev120: null, dev250: null };
  const closes = klines.map(k => k.close);
  const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
  const fmt = (n) => n !== null ? n.toFixed(3) : '--';
  const dev = (ma) => ma ? ((price - ma) / ma * 100).toFixed(2) + '%' : '--';

  let ma120 = null, ma250 = null;
  if (closes.length >= 120) ma120 = avg(closes.slice(-120));
  if (closes.length >= 250) ma250 = avg(closes.slice(-250));

  return {
    ma120: fmt(ma120),
    ma250: fmt(ma250),
    dev120: dev(ma120),
    dev250: dev(ma250)
  };
}

// 计算价格位置（近1年区间百分比）
function calcPricePosition(price, klines) {
  if (!klines || klines.length === 0) return null;
  const closes = klines.map(k => k.close);
  const high = Math.max(...closes);
  const low = Math.min(...closes);
  if (high === low) return { pct: 50, high, low };
  const pct = ((price - low) / (high - low)) * 100;
  return { pct: Math.max(0, Math.min(100, pct)), high, low };
}

function drawSparkline(canvas, klines, direction) {
  if (!klines || klines.length < 2) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;
  const padding = 2;

  // 取最近30个交易日
  const recent = klines.slice(-30);
  const closes = recent.map(k => k.close);
  const max = Math.max(...closes);
  const min = Math.min(...closes);
  const range = max - min || 1;

  const lineColor = direction === 'up' ? '#ef4444' : direction === 'down' ? '#10b981' : '#94a3b8';
  const fillColor = direction === 'up' ? 'rgba(239,68,68,0.15)' : direction === 'down' ? 'rgba(16,185,129,0.15)' : 'rgba(148,163,184,0.1)';

  ctx.clearRect(0, 0, w, h);

  // 填充区域
  ctx.beginPath();
  for (let i = 0; i < recent.length; i++) {
    const x = padding + (i / (recent.length - 1)) * (w - padding * 2);
    const y = padding + ((max - recent[i].close) / range) * (h - padding * 2);
    if (i === 0) ctx.moveTo(x, h - padding);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w - padding, h - padding);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();

  // 折线
  ctx.beginPath();
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  for (let i = 0; i < recent.length; i++) {
    const x = padding + (i / (recent.length - 1)) * (w - padding * 2);
    const y = padding + ((max - recent[i].close) / range) * (h - padding * 2);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

        <div class="hl-box">
          <div class="hl-label">近6月</div>
          <div class="hl-high">${hl ? hl.m6.high.toFixed(3) : '--'}</div>
          <div class="hl-low">${hl ? hl.m6.low.toFixed(3) : '--'}</div>
        </div>
        <div class="hl-box">
          <div class="hl-label">近1年</div>
          <div class="hl-high">${hl ? hl.y1.high.toFixed(3) : '--'}</div>
          <div class="hl-low">${hl ? hl.y1.low.toFixed(3) : '--'}</div>
        </div>
      </div>
      <!-- 价格位置条 -->
      <div class="position-section">
        <div class="position-header">
          <span>近1年价格位置</span>
          <span style="color:${pos && pos.pct < 30 ? 'var(--green)' : pos && pos.pct > 70 ? 'var(--red)' : 'var(--orange)'};font-weight:600">${pos ? pos.pct.toFixed(1) + '%' : '--'}</span>
        </div>
        <div class="position-bar-wrap">
          <div class="position-bar-fill" style="width:100%"></div>
          <div class="position-bar-dot" style="left:${pos ? pos.pct + '%' : '50%'}"></div>
        </div>
        <div class="position-labels">
          <span>低 ${pos ? pos.low.toFixed(3) : '--'}</span>
          <span>高 ${pos ? pos.high.toFixed(3) : '--'}</span>
        </div>
      </div>
      <div class="metrics-row">
        <div class="metric-box">
          <div class="metric-label">涨跌额</div>
          <div class="metric-value ${direction}">${sign}${changeAmount.toFixed(3)}</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">昨收</div>
          <div class="metric-value">${prevClose.toFixed(3)}</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">规模</div>
          <div class="metric-value">${config.scale}亿</div>
        </div>
      </div>
      <div class="metrics-row">
        <div class="metric-box">
          <div class="metric-label">最大回撤</div>
          <div class="metric-value" style="color:var(--red)">${config.maxDD}</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">股息率</div>
          <div class="metric-value" style="color:var(--green)">${config.yield}</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">成立时间</div>
          <div class="metric-value">${config.estStart}</div>
        </div>
      </div>
      <div class="metrics-row">
        <div class="metric-box">
          <div class="metric-label">MA120</div>
          <div class="metric-value" style="font-size:0.78rem">${ma.ma120} <span style="color:${price > parseFloat(ma.ma120) ? 'var(--red)' : 'var(--green)'};font-size:0.7rem">${ma.dev120}</span></div>
        </div>
        <div class="metric-box">
          <div class="metric-label">MA250</div>
          <div class="metric-value" style="font-size:0.78rem">${ma.ma250} <span style="color:${price > parseFloat(ma.ma250) ? 'var(--red)' : 'var(--green)'};font-size:0.7rem">${ma.dev250}</span></div>
        </div>
        <div class="metric-box">
          <div class="metric-label">换手率</div>
          <div class="metric-value" style="font-size:0.78rem">${changeRate > 0 ? changeRate.toFixed(2) + '%' : '--'}</div>
        </div>
      </div>
      <div class="metrics-row">
        <div class="metric-box">
          <div class="metric-label">指数PE</div>
          <div class="metric-value" style="font-size:0.78rem">${indexPE || '--'}</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">指数PB</div>
          <div class="metric-value" style="font-size:0.78rem">${indexPB || '--'}</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">成交额</div>
          <div class="metric-value" style="font-size:0.78rem">${turnoverAmt > 0 ? (turnoverAmt / 10000).toFixed(1) + '万' : '--'}</div>
        </div>
      </div>
      <div class="dividend-info">
        <div class="dividend-row">
          <span class="label">分红方式</span><span class="value">${config.divType}</span>
        </div>
        <div class="dividend-row">
          <span class="label">分红频率</span><span class="value">${config.divFreq}</span>
        </div>
        <div class="dividend-row">
          <span class="label">年费率</span><span class="value">${config.fee}</span>
        </div>
        <div class="dividend-row">
          <span class="label">跟踪指数</span><span class="value">${config.index}</span>
        </div>
      </div>
    `;
    cardsContainer.appendChild(card);

    // 绘制走势图
    setTimeout(() => {
      const canvas = document.getElementById(`chart-${code}`);
      if (canvas) drawSparkline(canvas, klines, direction);
    }, 50);

    // 创建表格行
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="code">${code}</td>
      <td>${config.name}</td>
      <td class="price ${direction}">${price.toFixed(3)}</td>
      <td class="${direction}">${sign}${changeAmount.toFixed(3)}</td>
      <td class="${direction}">${sign}${changePercent.toFixed(2)}%</td>
      <td class="up">${todayHigh > 0 ? todayHigh.toFixed(3) : '--'}</td>
      <td class="down">${todayLow > 0 ? todayLow.toFixed(3) : '--'}</td>
      <td>${prevClose.toFixed(3)}</td>
      <td class="up">${hl ? hl.m1.high.toFixed(3) : '--'}</td>
      <td class="down">${hl ? hl.m1.low.toFixed(3) : '--'}</td>
      <td class="up">${hl ? hl.m6.high.toFixed(3) : '--'}</td>
      <td class="down">${hl ? hl.m6.low.toFixed(3) : '--'}</td>
      <td class="up">${hl ? hl.y1.high.toFixed(3) : '--'}</td>
      <td class="down">${hl ? hl.y1.low.toFixed(3) : '--'}</td>
      <td>${config.scale}</td>
      <td>${config.fee}</td>
      <td>${config.divFreq}</td>
    `;
    tableBody.appendChild(tr);
  }
}

// ===================== 主流程 =====================

async function fetchAll() {
  const statusEl = document.getElementById('status');
  statusEl.innerHTML = '<span class="refresh-dot"></span>更新中...';
  statusEl.className = 'status';

  // 兜底：10秒后如果还在 loading，强制显示提示
  const fallbackTimer = setTimeout(() => {
    const cardsEl = document.getElementById('cardsContainer');
    if (cardsEl && cardsEl.querySelector('.loading-spinner')) {
      cardsEl.innerHTML = `
        <div class="loading-overlay" style="grid-column:1/-1">
          <p style="color:#ef4444;font-weight:600;margin-bottom:8px">加载超时 (10秒)</p>
          <p style="font-size:0.85rem;color:#94a3b8;margin-bottom:12px">网络连接较慢或无法连接到行情服务器，<br>建议尝试 <strong style="color:#f59e0b">开启 VPN</strong> 后刷新页面。</p>
          <button class="btn btn-primary" onclick="fetchAll()">重新加载</button>
        </div>`;
      statusEl.innerHTML = '加载超时，<a href="javascript:fetchAll()" style="color:#3b82f6;text-decoration:underline;">点击重试</a>';
      statusEl.className = 'status error';
    }
  }, 10000);

  try {
    const [realtime, klinesMap] = await Promise.all([
      fetchRealtime(),
      fetchAllKlines()
    ]);
    clearTimeout(fallbackTimer);

    updateDashboard(realtime, klinesMap);
    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
    statusEl.innerHTML = '<span class="refresh-dot"></span>自动刷新中 (30s)';
    statusEl.className = 'status connected';
  } catch (error) {
    clearTimeout(fallbackTimer);
    console.error('获取数据失败:', error);
    const msg = error.message || '网络错误';
    const cardsEl = document.getElementById('cardsContainer');
    if (cardsEl.children.length <= 1 && cardsEl.querySelector('.loading-spinner')) {
      cardsEl.innerHTML = `
        <div class="loading-overlay" style="grid-column:1/-1">
          <p style="color:#ef4444;font-weight:600;margin-bottom:8px">数据加载失败 (${msg})</p>
          <p style="font-size:0.85rem;color:#94a3b8;margin-bottom:12px">可能是网络原因导致无法连接到行情服务器，<br>建议尝试 <strong style="color:#f59e0b">开启 VPN</strong> 后刷新页面。</p>
          <button class="btn btn-primary" onclick="fetchAll()">重新加载</button>
        </div>`;
    }
    statusEl.innerHTML = `获取失败 (${msg})，<a href="javascript:fetchAll()" style="color:#3b82f6;text-decoration:underline;">点击重试</a>`;
    statusEl.className = 'status error';
  }
}

// 自动刷新（仅刷新实时价格，K线数据每5分钟刷新一次）
let klineLastFetch = 0;
async function fetchRealtimeOnly() {
  const statusEl = document.getElementById('status');
  statusEl.innerHTML = '<span class="refresh-dot"></span>更新中...';
  statusEl.className = 'status';

  try {
    const now = Date.now();
    let klinesMap = klineCache;

    // 每5分钟刷新K线数据
    if (now - klineLastFetch > 300000 || Object.keys(klinesMap).length === 0) {
      klinesMap = await fetchAllKlines();
      klineCache = klinesMap;
      klineLastFetch = now;
    }

    const realtime = await fetchRealtime();
    updateDashboard(realtime, klinesMap);
    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
    statusEl.innerHTML = '<span class="refresh-dot"></span>自动刷新中 (30s)';
    statusEl.className = 'status connected';
  } catch (error) {
    console.error('获取数据失败:', error);
    const msg = error.message || '网络错误';
    const cardsEl = document.getElementById('cardsContainer');
    if (cardsEl.children.length <= 1 && cardsEl.querySelector('.loading-spinner')) {
      cardsEl.innerHTML = `
        <div class="loading-overlay" style="grid-column:1/-1">
          <p style="color:#ef4444;font-weight:600;margin-bottom:8px">数据加载失败 (${msg})</p>
          <p style="font-size:0.85rem;color:#94a3b8;margin-bottom:12px">可能是网络原因导致无法连接到行情服务器，<br>建议尝试 <strong style="color:#f59e0b">开启 VPN</strong> 后刷新页面。</p>
          <button class="btn btn-primary" onclick="fetchAll()">重新加载</button>
        </div>`;
    }
    statusEl.innerHTML = `获取失败 (${msg})，<a href="javascript:fetchAll()" style="color:#3b82f6;text-decoration:underline;">点击重试</a>`;
    statusEl.className = 'status error';
  }
}

function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  const btn = document.getElementById('autoBtn');
  if (autoRefresh) {
    btn.textContent = '暂停刷新';
    startAutoRefresh();
  } else {
    btn.textContent = '继续刷新';
    stopAutoRefresh();
  }
}

function startAutoRefresh() {
  stopAutoRefresh();
  refreshInterval = setInterval(fetchRealtimeOnly, 30000);
}

function stopAutoRefresh() {
  if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
}

// 初始化
fetchAll().then(() => startAutoRefresh());

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopAutoRefresh();
  } else if (autoRefresh) {
    fetchRealtimeOnly();
    startAutoRefresh();
  }
});
</script>
