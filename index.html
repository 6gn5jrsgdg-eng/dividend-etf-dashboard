<script>
// ===================== ETF配置 =====================
const etfConfig = {
  '512890': { name:'华泰柏瑞红利低波ETF',    market:'1', scale:'312.90', fee:'0.60%', divFreq:'从不', divType:'净值增长', index:'中证红利低波' },
  '563020': { name:'易方达红利低波ETF',        market:'1', scale:'113.61', fee:'0.20%', divFreq:'季度', divType:'现金分红', index:'中证红利低波' },
  '159547': { name:'华夏红利低波ETF',          market:'0', scale:'14.65',  fee:'0.20%', divFreq:'季度评估', divType:'现金分红', index:'中证红利低波' },
  '159307': { name:'博时红利低波100ETF',       market:'0', scale:'69.37',  fee:'0.20%', divFreq:'季度', divType:'现金分红', index:'中证红利低波100' },
  '515100': { name:'景顺长城红利低波100ETF',   market:'1', scale:'55.25',  fee:'0.60%', divFreq:'不定期', divType:'现金分红', index:'中证红利低波100' },
  '515450': { name:'南方红利低波50ETF',        market:'1', scale:'180.00', fee:'0.60%', divFreq:'半年左右', divType:'现金分红', index:'标普A股红利低波50' }
};

let autoRefresh = true;
let refreshInterval = null;
let klineCache = {};

// ===================== 数据获取 =====================

async function fetchRealtime() {
  const secids = Object.keys(etfConfig).map(c => etfConfig[c].market + '.' + c).join(',');
  const url = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&invt=2&fields=f12,f13,f14,f2,f3,f4,f18,f20&secids=' + secids + '&_=' + Date.now();
  const resp = await fetch(url);
  const data = await resp.json();
  if (!data.data || !data.data.diff) throw new Error('实时数据获取失败');
  return data.data.diff;
}

async function fetchKline(code, market, count) {
  const secid = market + '.' + code;
  const endDate = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=' + secid + '&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57&klt=101&fqt=0&end=' + endDate + '&lmt=' + count;
  const resp = await fetch(url);
  const data = await resp.json();
  if (!data.data || !data.data.klines) return [];
  return data.data.klines.map(function(line) {
    var parts = line.split(',');
    return {
      date: parts[0],
      open: parseFloat(parts[1]),
      close: parseFloat(parts[2]),
      high: parseFloat(parts[3]),
      low: parseFloat(parts[4]),
      volume: parseFloat(parts[5]),
      amount: parseFloat(parts[6])
    };
  });
}

async function fetchAllKlines() {
  var codes = Object.keys(etfConfig);
  var results = {};
  for (var i = 0; i < codes.length; i += 3) {
    var batch = codes.slice(i, i + 3);
    var batchResults = await Promise.all(batch.map(function(code) {
      var cfg = etfConfig[code];
      return fetchKline(code, cfg.market, 260).then(function(klines) {
        return { code: code, klines: klines };
      });
    }));
    for (var j = 0; j < batchResults.length; j++) {
      results[batchResults[j].code] = batchResults[j].klines;
    }
  }
  return results;
}

function calcHighLow(klines) {
  if (!klines || klines.length === 0) return null;
  var now = new Date();
  var oneMonthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  var sixMonthsAgo = new Date(now.getTime() - 182 * 24 * 60 * 60 * 1000);
  var oneYearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);

  var periods = {
    m1: { high: -Infinity, low: Infinity },
    m6: { high: -Infinity, low: Infinity },
    y1: { high: -Infinity, low: Infinity }
  };

  for (var i = 0; i < klines.length; i++) {
    var k = klines[i];
    var d = new Date(k.date);
    if (d >= oneMonthAgo) {
      if (k.high > periods.m1.high) periods.m1.high = k.high;
      if (k.low < periods.m1.low) periods.m1.low = k.low;
    }
    if (d >= sixMonthsAgo) {
      if (k.high > periods.m6.high) periods.m6.high = k.high;
      if (k.low < periods.m6.low) periods.m6.low = k.low;
    }
    if (d >= oneYearAgo) {
      if (k.high > periods.y1.high) periods.y1.high = k.high;
      if (k.low < periods.y1.low) periods.y1.low = k.low;
    }
  }
  return periods;
}

// ===================== 渲染 =====================

function drawSparkline(canvas, klines, direction) {
  if (!klines || klines.length < 2) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  var w = rect.width;
  var h = rect.height;
  var padding = 2;

  var recent = klines.slice(-30);
  var closes = recent.map(function(k) { return k.close; });
  var max = Math.max.apply(null, closes);
  var min = Math.min.apply(null, closes);
  var range = max - min || 1;

  var lineColor = direction === 'up' ? '#ef4444' : direction === 'down' ? '#10b981' : '#94a3b8';
  var fillColor = direction === 'up' ? 'rgba(239,68,68,0.15)' : direction === 'down' ? 'rgba(16,185,129,0.15)' : 'rgba(148,163,184,0.1)';

  ctx.clearRect(0, 0, w, h);

  ctx.beginPath();
  for (var i = 0; i < recent.length; i++) {
    var x = padding + (i / (recent.length - 1)) * (w - padding * 2);
    var y = padding + ((max - recent[i].close) / range) * (h - padding * 2);
    if (i === 0) ctx.moveTo(x, h - padding);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w - padding, h - padding);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();

  ctx.beginPath();
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  for (var i = 0; i < recent.length; i++) {
    var x = padding + (i / (recent.length - 1)) * (w - padding * 2);
    var y = padding + ((max - recent[i].close) / range) * (h - padding * 2);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function updateDashboard(realtime, klinesMap) {
  var cardsContainer = document.getElementById('cardsContainer');
  var tableBody = document.getElementById('tableBody');
  cardsContainer.innerHTML = '';
  tableBody.innerHTML = '';

  for (var idx = 0; idx < realtime.length; idx++) {
    var item = realtime[idx];
    var code = item.f12;
    var config = etfConfig[code];
    if (!config) continue;

    var price = parseFloat(item.f2);
    var changePercent = parseFloat(item.f3);
    var changeAmount = parseFloat(item.f4);
    var prevClose = parseFloat(item.f18);
    var isUp = changePercent > 0;
    var isDown = changePercent < 0;
    var direction = isUp ? 'up' : (isDown ? 'down' : 'flat');
    var sign = isUp ? '+' : '';

    var klines = klinesMap[code] || [];
    var hl = calcHighLow(klines);

    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-header">' +
        '<div>' +
          '<div class="card-title">' + config.name + '</div>' +
          '<span class="card-code">' + code + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="price-section">' +
        '<span class="price ' + direction + '">' + price.toFixed(3) + '</span>' +
        '<span class="change ' + direction + '">' + sign + changePercent.toFixed(2) + '%</span>' +
      '</div>' +
      '<div class="sparkline-wrap">' +
        '<canvas id="chart-' + code + '" style="width:100%;height:50px"></canvas>' +
      '</div>' +
      '<div class="hl-section">' +
        '<div class="hl-box">' +
          '<div class="hl-label">近1月</div>' +
          '<div class="hl-high">' + (hl ? hl.m1.high.toFixed(3) : '--') + '</div>' +
          '<div class="hl-low">' + (hl ? hl.m1.low.toFixed(3) : '--') + '</div>' +
        '</div>' +
        '<div class="hl-box">' +
          '<div class="hl-label">近6月</div>' +
          '<div class="hl-high">' + (hl ? hl.m6.high.toFixed(3) : '--') + '</div>' +
          '<div class="hl-low">' + (hl ? hl.m6.low.toFixed(3) : '--') + '</div>' +
        '</div>' +
        '<div class="hl-box">' +
          '<div class="hl-label">近1年</div>' +
          '<div class="hl-high">' + (hl ? hl.y1.high.toFixed(3) : '--') + '</div>' +
          '<div class="hl-low">' + (hl ? hl.y1.low.toFixed(3) : '--') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="metrics-row">' +
        '<div class="metric-box"><div class="metric-label">涨跌额</div><div class="metric-value ' + direction + '">' + sign + changeAmount.toFixed(3) + '</div></div>' +
        '<div class="metric-box"><div class="metric-label">昨收</div><div class="metric-value">' + prevClose.toFixed(3) + '</div></div>' +
        '<div class="metric-box"><div class="metric-label">规模</div><div class="metric-value">' + config.scale + '亿</div></div>' +
      '</div>' +
      '<div class="dividend-info">' +
        '<div class="dividend-title">分红信息</div>' +
        '<div class="dividend-row"><span class="label">分红方式</span><span class="value">' + config.divType + '</span></div>' +
        '<div class="dividend-row"><span class="label">分红频率</span><span class="value">' + config.divFreq + '</span></div>' +
        '<div class="dividend-row"><span class="label">年费率</span><span class="value">' + config.fee + '</span></div>' +
        '<div class="dividend-row"><span class="label">跟踪指数</span><span class="value">' + config.index + '</span></div>' +
      '</div>';
    cardsContainer.appendChild(card);

    setTimeout((function(c, k, d) {
      return function() {
        var canvas = document.getElementById('chart-' + c);
        if (canvas) drawSparkline(canvas, k, d);
      };
    })(code, klines, direction), 50);

    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="code">' + code + '</td>' +
      '<td>' + config.name + '</td>' +
      '<td class="price ' + direction + '">' + price.toFixed(3) + '</td>' +
      '<td class="' + direction + '">' + sign + changeAmount.toFixed(3) + '</td>' +
      '<td class="' + direction + '">' + sign + changePercent.toFixed(2) + '%</td>' +
      '<td>' + prevClose.toFixed(3) + '</td>' +
      '<td class="up">' + (hl ? hl.m1.high.toFixed(3) : '--') + '</td>' +
      '<td class="down">' + (hl ? hl.m1.low.toFixed(3) : '--') + '</td>' +
      '<td class="up">' + (hl ? hl.m6.high.toFixed(3) : '--') + '</td>' +
      '<td class="down">' + (hl ? hl.m6.low.toFixed(3) : '--') + '</td>' +
      '<td class="up">' + (hl ? hl.y1.high.toFixed(3) : '--') + '</td>' +
      '<td class="down">' + (hl ? hl.y1.low.toFixed(3) : '--') + '</td>' +
      '<td>' + config.scale + '</td>' +
      '<td>' + config.fee + '</td>' +
      '<td>' + config.divFreq + '</td>';
    tableBody.appendChild(tr);
  }
}

// ===================== 主流程 =====================

async function fetchAll() {
  var statusEl = document.getElementById('status');
  statusEl.innerHTML = '<span class="refresh-dot"></span>更新中...';
  statusEl.className = 'status';

  try {
    var results = await Promise.all([fetchRealtime(), fetchAllKlines()]);
    var realtime = results[0];
    var klinesMap = results[1];
    updateDashboard(realtime, klinesMap);
    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
    statusEl.innerHTML = '<span class="refresh-dot"></span>自动刷新中 (30s)';
    statusEl.className = 'status connected';
  } catch (error) {
    console.error('获取数据失败:', error);
    statusEl.innerHTML = '获取失败，点击"立即刷新"重试';
    statusEl.className = 'status error';
  }
}

var klineLastFetch = 0;
async function fetchRealtimeOnly() {
  var statusEl = document.getElementById('status');
  statusEl.innerHTML = '<span class="refresh-dot"></span>更新中...';
  statusEl.className = 'status';

  try {
    var now = Date.now();
    var klinesMap = klineCache;
    if (now - klineLastFetch > 300000 || Object.keys(klinesMap).length === 0) {
      klinesMap = await fetchAllKlines();
      klineCache = klinesMap;
      klineLastFetch = now;
    }
    var realtime = await fetchRealtime();
    updateDashboard(realtime, klinesMap);
    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
    statusEl.innerHTML = '<span class="refresh-dot"></span>自动刷新中 (30s)';
    statusEl.className = 'status connected';
  } catch (error) {
    console.error('获取数据失败:', error);
    statusEl.innerHTML = '获取失败，点击"立即刷新"重试';
    statusEl.className = 'status error';
  }
}

function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  var btn = document.getElementById('autoBtn');
  if (autoRefresh) { btn.textContent = '暂停刷新'; startAutoRefresh(); }
  else { btn.textContent = '继续刷新'; stopAutoRefresh(); }
}

function startAutoRefresh() {
  stopAutoRefresh();
  refreshInterval = setInterval(fetchRealtimeOnly, 30000);
}

function stopAutoRefresh() {
  if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
}

fetchAll().then(function() { startAutoRefresh(); });

document.addEventListener('visibilitychange', function() {
  if (document.hidden) { stopAutoRefresh(); }
  else if (autoRefresh) { fetchRealtimeOnly(); startAutoRefresh(); }
});
</script>

</body>
